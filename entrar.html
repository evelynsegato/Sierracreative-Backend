<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Entrar | Sierra Creative</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

    <header>

        <a href="index.html" class="logo">SIERRA CREATIVE</a>

        <nav>

            <a href="index.html">Início</a>
            <a href="sobre.html">Sobre</a>
            <a href="servicos.html">Serviços</a>
            <a href="portfolio.html">Portfólio</a>
            <a href="contato.html">Contato</a>

        </nav>

    </header>

    <main>

        <section class="auth">

            <p class="contato-pequeno">ÁREA DO CLIENTE</p>

            <h1>Acesse sua conta</h1>

            <div class="auth-abas">
                <button type="button" id="aba-login" class="aba ativa">Entrar</button>
                <button type="button" id="aba-cadastro" class="aba">Criar conta</button>
            </div>

            <p id="auth-mensagem" class="auth-mensagem"></p>

            <!-- Formulário de login -->
            <form id="form-login" class="formulario-contato auth-form">

                <label for="login-email">E-mail</label>
                <input type="email" id="login-email" name="email" maxlength="150"
                       autocomplete="email" required>
                <p class="auth-erro" data-erro="email"></p>

                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" name="senha" maxlength="72"
                       autocomplete="current-password" required>
                <p class="auth-erro" data-erro="senha"></p>

                <button type="submit">Entrar</button>

            </form>

            <!-- Formulário de cadastro -->
            <form id="form-cadastro" class="formulario-contato auth-form" hidden>

                <label for="cad-nome">Nome</label>
                <input type="text" id="cad-nome" name="nome" maxlength="100"
                       autocomplete="name" required>
                <p class="auth-erro" data-erro="nome"></p>

                <label for="cad-email">E-mail</label>
                <input type="email" id="cad-email" name="email" maxlength="150"
                       autocomplete="email" required>
                <p class="auth-erro" data-erro="email"></p>

                <label for="cad-senha">Senha (8 a 72 caracteres)</label>
                <input type="password" id="cad-senha" name="senha" maxlength="72"
                       autocomplete="new-password" required>
                <p class="auth-erro" data-erro="senha"></p>

                <button type="submit">Criar conta</button>

            </form>

        </section>

    </main>

    <footer>

        <p>© 2026 Sierra Creative. Todos os direitos reservados.</p>

    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>

</body>

</html>
